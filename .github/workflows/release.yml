name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Load Chrome from disk while the job sets up
        run: google-chrome --headless=new --dump-dom about:blank > /dev/null 2>&1 & echo $! > "$RUNNER_TEMP/chrome.pid"
      - uses: ./.github/actions/bun
      - name: Check that the tag matches apps/sand/package.json
        run: test "v$(bun -p 'require("./apps/sand/package.json").version')" = "$GITHUB_REF_NAME"
      - name: Wait for Chrome to finish loading, so the browser tests start it warm
        run: timeout 60 tail --pid="$(cat "$RUNNER_TEMP/chrome.pid")" -f /dev/null
      - run: bun run check
      - name: Build the release assets
        run: bun apps/sand/src/main.ts release-assets "$RUNNER_TEMP/assets"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease \
            "$RUNNER_TEMP"/assets/*
