name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check that the tag matches apps/sand/package.json
        run: test "v$(bun -p 'require("./apps/sand/package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Build the release assets
        run: bun apps/sand/src/main.ts release-assets "$RUNNER_TEMP/assets"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease \
            "$RUNNER_TEMP/assets/sand.tar.gz" "$RUNNER_TEMP/assets/sand-build.json"
