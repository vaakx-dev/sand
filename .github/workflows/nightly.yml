name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: nightly

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Skip when main has not changed
        id: changed
        run: |
          built="$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)"
          if [ "$built" = "$(git rev-parse HEAD)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changed.outputs.skip != 'true'
        name: Load Chrome from disk while the job sets up
        run: google-chrome --headless=new --dump-dom about:blank > /dev/null 2>&1 & echo $! > "$RUNNER_TEMP/chrome.pid"
      - if: steps.changed.outputs.skip != 'true'
        uses: ./.github/actions/bun
      - if: steps.changed.outputs.skip != 'true'
        name: Wait for Chrome to finish loading, so the browser tests start it warm
        run: timeout 60 tail --pid="$(cat "$RUNNER_TEMP/chrome.pid")" -f /dev/null
      - if: steps.changed.outputs.skip != 'true'
        run: bun run check
      - if: steps.changed.outputs.skip != 'true'
        name: Build the release assets
        run: bun apps/sand/src/main.ts release-assets "$RUNNER_TEMP/assets"
      - if: steps.changed.outputs.skip != 'true'
        name: Move the nightly release to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly --target "$commit" --prerelease --latest=false \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Built from ${commit:0:7} on main, the newest commit that passed the checks. This release moves at most once a day when main changes. Install it with \`curl -fsSL https://vaakx-dev.github.io/sand/install.sh | sh -s -- --channel nightly\`, or in PowerShell with \`\$env:SAND_CHANNEL='nightly'; irm https://vaakx-dev.github.io/sand/install.ps1 | iex\`." \
            "$RUNNER_TEMP"/assets/*
