name: Set up Bun and install
description: Install Bun and the workspace, reusing Bun's install cache so GitHub and npm hiccups don't fail the job

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - shell: bash
      run: echo '0.0.0.0 github.com codeload.github.com api.github.com registry.npmjs.org' | sudo tee -a /etc/hosts && ! curl -sf --max-time 5 https://codeload.github.com
    - shell: bash
      run: bun install --frozen-lockfile
